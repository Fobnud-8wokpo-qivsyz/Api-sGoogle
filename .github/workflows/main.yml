name: Auto Ejecutable API

on:
  push:
    branches:
      - Principal # Ejecutar el flujo de trabajo al hacer push a la rama Principal
  pull_request:
    branches:
      - Principal # Ejecutar el flujo de trabajo al crear PR a la rama Principal

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
    # Paso 1: Clonar el repositorio
    - name: Checkout del código
      uses: actions/checkout@v3

    # Paso 2: Configurar Python
    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.9"  # Cambia la versión si es necesario

    # Paso 3: Instalar dependencias
    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # Paso 4: Ejecutar el proyecto
    - name: Ejecutar el proyecto
      run: |
        python src/main.py